name: Business Value Tests

on:
  push:
    paths:
      - "01_Limpieza_de_Datos/**"
      - "05_Analisis_Econometrico/**"
  pull_request:
    paths:
      - "01_Limpieza_de_Datos/**"
      - "05_Analisis_Econometrico/**"
  workflow_dispatch:

jobs:
  business-value-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest -r 05_Analisis_Econometrico/requirements.txt

      - name: Regenerate curated_gold from raw data
        working-directory: 01_Limpieza_de_Datos
        run: |
          python 01_generar_datos_historicos_ventas.py
          python 02_generar_presupuesto_2025.py
          python 03_etl_pipeline_cleaner.py

      - name: Run econometric pipeline
        working-directory: 05_Analisis_Econometrico
        run: |
          python src/analisis_elasticidad_cointegracion.py
          python src/estacionalidad_y_forecast.py
          python src/exportar_resultados_powerbi.py
          python src/ml_riesgo_prediccion.py
          python src/inferencia_causal_erpt.py
          python src/modelo_miller_orr_var.py

      - name: Business-value sanity tests
        run: python -m pytest 01_Limpieza_de_Datos/tests/ -v

      - name: Power BI Suite TMDL & PBIR Architecture Audit
        run: python tools/audit_powerbi_suite.py
