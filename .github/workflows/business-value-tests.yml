name: Business Value Tests

on:
  push:
    paths:
      - "Ingenieria_de_Datos/**"
      - "Analisis_Econometrico/**"
  pull_request:
    paths:
      - "Ingenieria_de_Datos/**"
      - "Analisis_Econometrico/**"
  workflow_dispatch:

jobs:
  business-value-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest -r Analisis_Econometrico/requirements.txt

      - name: Regenerate curated_gold from raw data
        working-directory: Ingenieria_de_Datos
        run: |
          python generar_datos_historicos_ventas.py
          python generar_presupuesto_2025.py
          python etl_pipeline_cleaner.py

      - name: Run econometric pipeline
        working-directory: Analisis_Econometrico
        run: |
          python src/analisis_elasticidad_cointegracion.py
          python src/estacionalidad_y_forecast.py
          python src/exportar_resultados_powerbi.py

      - name: Business-value sanity tests
        run: python -m pytest Ingenieria_de_Datos/tests/ -v
